<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>Suxi Render Verify</title>
<style>
  body { margin:0; background:#2b2b2b; display:flex; gap:20px; padding:20px; }
  canvas { background:#1a1a1a; border:1px solid #555; }
</style>
</head>
<body>
<canvas id="c" width="420" height="440"></canvas>
<script type="module">
import { SuxiRenderer } from '/src/suxiRenderer.ts';
import { DaFeiYuRenderer } from '/src/dafeiyuRenderer.ts';

const kb108 = location.search.includes('kb108');
const canvas = document.getElementById('c');
if (kb108) { canvas.width = 540; canvas.height = 456; }
const ctx = canvas.getContext('2d');
const r = location.search.includes('whale') ? new DaFeiYuRenderer() : new SuxiRenderer();

const layout = kb108 ? {
  logicalW: 540, logicalH: 456,
  kbCenterX: 290, kbCenterY: 356, kbWidth: 398, kbHeight: 96, kbTiltRad: 0.042,
  mouseBtnX: 54, mouseBtnY: 332, cursor: null,
  mouseNX: 0, mouseLeft: false, mouseRight: false,
  mouseActiveAt: -10000, mouseClickAt: -10000,
  petEnergy: 0, privacyMode: false, privacyTypingAt: -10000, is108: true,
} : {
  logicalW: 420, logicalH: 440,
  kbCenterX: 214, kbCenterY: 353, kbWidth: 266, kbHeight: 74, kbTiltRad: 0.0593,
  mouseBtnX: 72, mouseBtnY: 322, cursor: null,
  mouseNX: 0, mouseLeft: false, mouseRight: false,
  mouseActiveAt: -10000, mouseClickAt: -10000,
  petEnergy: 0, privacyMode: false, privacyTypingAt: -10000, is108: false,
};

let now = performance.now();
// ?typing 模拟打字：左右手交替按键盘
const typing = location.search.includes('typing');
const edgeSim = location.search.includes('edge');
const mouseSim = location.search.includes('mouse');
let lastType = 0;
function frame() {
  now = performance.now(); // 与 onKeyDown 内部时钟保持一致（headless 虚拟时间下必须对齐）
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // 画一个示意键盘帮助定位
  if (kb108) { ctx.fillStyle='#333'; ctx.fillRect(91,308,398,96); }
  else { ctx.fillStyle='#333'; ctx.fillRect(81,316,266,74); }
  if (mouseSim) { layout.mouseActiveAt = now - 100; layout.cursor = {x: layout.mouseBtnX, y: layout.mouseBtnY}; }
  if ((typing || edgeSim) && now - lastType > 200) {
    lastType = now;
    const left = Math.floor(now / 200) % 2 === 0;
    // edge 模式：按键盘最左下角与最右侧的键，检验手落点是否贴合按键
    const pt = edgeSim ? (left ? {x:100,y:373} : {x:330,y:342}) : (left ? {x:170,y:348} : {x:250,y:348});
    r.onKeyDown(left ? 65 : 76, pt, layout, false, false);
    setTimeout(() => r.onKeyUp(left ? 65 : 76), 90);
  }
  r.update(0.016, now, layout);
  r.renderBody(ctx, now, layout);
  r.renderForeground(ctx, 0.016, now, layout);
  now += 16;
  requestAnimationFrame(frame);
}
frame();
window.__ready = true;
window.__renderer = r;
</script>
</body>
</html>
